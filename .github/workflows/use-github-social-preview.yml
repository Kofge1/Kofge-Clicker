name: Use GitHub social preview on website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/use-github-social-preview.yml

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Open Graph and Twitter preview
        shell: python
        run: |
          from pathlib import Path

          preview = "https://opengraph.githubassets.com/kofge-site-20260821/Kofge1/Kofge-Clicker"
          old_image = "https://github.com/user-attachments/assets/8e742f98-5788-48d9-b2d3-e4b8ee8b6faa"

          for path in (Path("docs/index.html"), Path("docs/ru/index.html")):
              text = path.read_text(encoding="utf-8")

              if old_image not in text:
                  raise SystemExit(f"Expected old social preview image not found in {path}")

              # Only replace social metadata, not the actual hero screenshot further down the page.
              old_og = f'<meta property="og:image" content="{old_image}">'
              new_og = (
                  f'<meta property="og:image" content="{preview}">\n'
                  '  <meta property="og:image:width" content="1280">\n'
                  '  <meta property="og:image:height" content="640">'
              )
              if old_og not in text:
                  raise SystemExit(f"Expected og:image tag not found in {path}")
              text = text.replace(old_og, new_og, 1)

              twitter_card = '<meta name="twitter:card" content="summary_large_image">'
              twitter_image = f'<meta name="twitter:image" content="{preview}">'
              if twitter_image not in text:
                  if twitter_card not in text:
                      raise SystemExit(f"Expected Twitter card tag not found in {path}")
                  text = text.replace(twitter_card, twitter_card + "\n  " + twitter_image, 1)

              path.write_text(text, encoding="utf-8")

      - name: Commit website social preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ru/index.html
          git commit -m "Use GitHub social preview on website"
          git push
