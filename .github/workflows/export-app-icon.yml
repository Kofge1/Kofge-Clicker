name: Export app icon PNG

on:
  push:
    paths:
      - '.github/workflows/export-app-icon.yml'
      - 'Kofge-Clicker/Assets/AppIcon.ico'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert ICO to transparent 512x512 PNG
        shell: bash
        run: |
          mkdir -p docs/assets
          python - <<'PY'
          from PIL import Image
          source = 'Kofge-Clicker/Assets/AppIcon.ico'
          output = 'docs/assets/kofge-clicker-icon.png'
          ico = Image.open(source)
          try:
              sizes = list(ico.ico.sizes())
              best = max(sizes, key=lambda s: s[0] * s[1])
              image = ico.ico.getimage(best).convert('RGBA')
          except Exception:
              image = ico.convert('RGBA')
          image.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          x = (512 - image.width) // 2
          y = (512 - image.height) // 2
          canvas.paste(image, (x, y), image)
          canvas.save(output, 'PNG', optimize=True)
          print(f'Saved {output}: {canvas.size}')
          PY

      - name: Commit generated PNG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/kofge-clicker-icon.png
          if git diff --cached --quiet; then
            echo "Icon is already up to date."
            exit 0
          fi
          git commit -m "Add PNG app icon for web listings"
          git push
