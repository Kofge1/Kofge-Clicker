name: One-time site polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/site-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply prepared polish script
        shell: python
        run: |
          import subprocess

          previous = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/site-polish-once.yml'],
              text=True,
          )
          marker = '      - name: Polish website\n        shell: python\n        run: |\n'
          start = previous.index(marker) + len(marker)
          end = previous.index('\n      - name: Commit website polish', start)
          block = previous[start:end]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(code, '<site-polish>', 'exec'), {'__name__': '__main__'})

      - name: Commit website polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ru/index.html docs/guide/index.html docs/ru/guide/index.html docs/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Polish desktop and mobile website experience"
          git push
