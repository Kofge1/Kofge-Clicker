name: Replace support link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-support-link.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace DonationAlerts with Boosty
        shell: python
        run: |
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "**DonationAlerts:** [donationalerts.com/r/kofge](https://www.donationalerts.com/r/kofge)"
          new = "**Boosty:** [boosty.to/kofge/donate](https://boosty.to/kofge/donate)"
          if old not in text:
              raise SystemExit("DonationAlerts line was not found; README left unchanged.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Replace DonationAlerts with Boosty"
          git push
