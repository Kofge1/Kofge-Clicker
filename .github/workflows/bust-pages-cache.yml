name: Bust Pages cache for support script

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bust-pages-cache.yml

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version support config script references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("docs/index.html"): (
                  '<script src="./comments-config.js"></script>',
                  '<script src="./comments-config.js?v=20260821-boosty"></script>'
              ),
              Path("docs/ru/index.html"): (
                  '<script src="../comments-config.js"></script>',
                  '<script src="../comments-config.js?v=20260821-boosty"></script>'
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected script tag not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit cache-busting update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ru/index.html
          git commit -m "Refresh Boosty support link on Pages"
          git push
